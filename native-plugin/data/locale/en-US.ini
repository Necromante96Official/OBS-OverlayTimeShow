OBSOverlayTimeShow.Filter.Crop.Hint="For cameras that come with black bars baked into the image. The bars are removed before the shape is computed, so no black shows inside the circle. Manual crops are added on top of the automatic one, for fine tuning."
OBSOverlayTimeShow.Filter.Crop.Auto="Remove black borders automatically"
OBSOverlayTimeShow.Filter.Crop.Auto.Hint="Measures the image and figures out how much black bar there is on each side. The measurement is taken from a few samples right at the start and then stays put, so the source size does not change on its own and the image does not drift in the scene. It is taken again when the camera changes resolution or when you touch these options."
