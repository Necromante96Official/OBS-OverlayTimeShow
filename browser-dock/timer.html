<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer de Gravacao</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1a1a1a;
      --fg: #ffffff;
      --accent: #3dff8a;
      --paused: #ffc857;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .panel {
      text-align: center;
      padding: 16px;
    }

    .rec-dot {
      color: var(--accent);
      font-size: 28px;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .rec-dot.active {
      opacity: 1;
    }

    .time {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-top: 8px;
      font-family: "Cascadia Mono", Consolas, monospace;
    }

    .status {
      min-height: 1.4em;
      margin-top: 6px;
      color: var(--paused);
      font-weight: 600;
      font-size: 14px;
    }

    .hint {
      margin-top: 18px;
      font-size: 12px;
      opacity: 0.65;
      max-width: 260px;
    }

    .error {
      color: #ff6b6b;
    }
  </style>
</head>

<body>
  <div class="panel">
    <div id="dot" class="rec-dot">●</div>
    <div id="time" class="time">00:00</div>
    <div id="status" class="status"></div>
    <div id="hint" class="hint">Conectando ao OBS WebSocket...</div>
  </div>
  <script>
    // Preencha a senha do WebSocket do OBS, se houver autenticacao.
    const WS_HOST = "127.0.0.1";
    const WS_PORT = 4455;
    const WS_PASSWORD = "";

    const dot = document.getElementById("dot");
    const timeEl = document.getElementById("time");
    const statusEl = document.getElementById("status");
    const hintEl = document.getElementById("hint");

    let socket = null;
    let requestId = 1;
    let recording = false;
    let paused = false;
    let elapsedMs = 0;
    let segmentStart = performance.now();
    let uiTimer = null;
    let reconnectTimer = null;

    function formatElapsed(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function setHintError(message) {
      hintEl.textContent = "";
      const span = document.createElement("span");
      span.className = "error";
      span.textContent = message;
      hintEl.appendChild(span);
    }

    function updateUi() {
      const now = performance.now();
      if (recording && !paused) {
        elapsedMs += now - segmentStart;
      }
      segmentStart = now;
      timeEl.textContent = formatElapsed(elapsedMs);
      dot.classList.toggle("active", recording);
      statusEl.textContent = paused ? "PAUSADO" : "";
    }

    function ensureUiTimer() {
      if (uiTimer !== null) return;
      uiTimer = setInterval(updateUi, 100);
    }

    function clearUiTimer() {
      if (uiTimer !== null) {
        clearInterval(uiTimer);
        uiTimer = null;
      }
    }

    function clearReconnectTimer() {
      if (reconnectTimer !== null) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
    }

    function onRecordState(active, isPaused, seededDurationMs) {
      if (active && !recording) {
        recording = true;
        paused = !!isPaused;
        elapsedMs = typeof seededDurationMs === "number" && seededDurationMs >= 0
          ? seededDurationMs
          : 0;
        segmentStart = performance.now();
      } else if (active && recording) {
        if (isPaused && !paused) {
          const now = performance.now();
          elapsedMs += now - segmentStart;
          paused = true;
          segmentStart = now;
        } else if (!isPaused && paused) {
          paused = false;
          segmentStart = performance.now();
        }
      } else if (!active) {
        recording = false;
        paused = false;
        elapsedMs = 0;
        segmentStart = performance.now();
      }
      updateUi();
    }

    function sendRequest(requestType, requestData = {}) {
      const id = String(requestId++);
      socket.send(JSON.stringify({ op: 6, d: { requestType, requestId: id, requestData } }));
      return id;
    }

    function bytesToBase64(bytes) {
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    async function sha256Base64(input) {
      const data = typeof input === "string"
        ? new TextEncoder().encode(input)
        : input;
      const hash = await crypto.subtle.digest("SHA-256", data);
      return bytesToBase64(new Uint8Array(hash));
    }

    async function buildAuth(password, salt, challenge) {
      // Protocolo obs-websocket 5: secret = b64(sha256(password+salt)),
      // authentication = b64(sha256(secret+challenge)) com secret em texto Base64.
      const secret = await sha256Base64(password + salt);
      return sha256Base64(secret + challenge);
    }

    async function sendIdentify(hello) {
      const identify = {
        op: 1,
        d: {
          rpcVersion: 1,
          eventSubscriptions: 64
        }
      };
      if (hello && hello.authentication) {
        const { salt, challenge } = hello.authentication;
        identify.d.authentication = await buildAuth(WS_PASSWORD || "", salt, challenge);
      }
      hintEl.textContent = "Autenticando...";
      socket.send(JSON.stringify(identify));
    }

    function scheduleReconnect() {
      clearReconnectTimer();
      reconnectTimer = setTimeout(connect, 3000);
    }

    function closeSocket() {
      if (!socket) return;
      const current = socket;
      socket = null;
      try {
        current.onopen = null;
        current.onmessage = null;
        current.onclose = null;
        current.onerror = null;
        current.close();
      } catch (_) {
        /* ignore */
      }
    }

    function connect() {
      clearReconnectTimer();
      closeSocket();
      hintEl.textContent = "Conectando ao OBS WebSocket...";

      const ws = new WebSocket(`ws://${WS_HOST}:${WS_PORT}`);
      socket = ws;

      ws.addEventListener("open", () => {
        hintEl.textContent = "Aguardando Hello...";
      });

      ws.addEventListener("message", async (event) => {
        let payload;
        try {
          payload = JSON.parse(event.data);
        } catch (_) {
          return;
        }

        const { op, d } = payload;

        if (op === 0) {
          try {
            await sendIdentify(d);
          } catch (err) {
            setHintError("Falha ao autenticar no WebSocket.");
            console.error(err);
            ws.close();
          }
          return;
        }

        if (op === 2) {
          hintEl.textContent = "Dock interno do OBS — nao aparece na gravacao.";
          ensureUiTimer();
          sendRequest("GetRecordStatus");
          return;
        }

        if (op === 3) {
          setHintError(`Auth falhou: ${d && d.authenticationFailure ? "senha incorreta" : "Identify rejeitado"}`);
          return;
        }

        if (op === 5 && d.eventType === "RecordStateChanged") {
          onRecordState(d.eventData.outputActive, d.eventData.outputPaused);
          return;
        }

        if (op === 7 && d.requestType === "GetRecordStatus") {
          const data = d.responseData || {};
          const duration = typeof data.outputDuration === "number" ? data.outputDuration : undefined;
          onRecordState(data.outputActive, data.outputPaused, duration);
          return;
        }

        if (op === 8) {
          setHintError(`Erro OBS: ${d && d.error ? d.error : "desconhecido"}`);
        }
      });

      ws.addEventListener("close", () => {
        if (socket !== ws) return;
        socket = null;
        clearUiTimer();
        setHintError("Desconectado. Verifique o WebSocket do OBS.");
        scheduleReconnect();
      });
    }

    connect();
  </script>
</body>

</html>
